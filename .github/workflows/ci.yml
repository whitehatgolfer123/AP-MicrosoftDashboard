# ============================================================================
# Build, test, format and secret-scanning checks.
#
# Phase 0 of ROADMAP.md asks for exactly these four. Everything here runs on
# GitHub-hosted runners with no paid service and no external account.
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same ref makes an in-flight run redundant.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  CI: 'true'

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # The version comes from global.json, so the runner and a developer
          # machine cannot drift apart.
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      # -warnaserror here rather than in Directory.Build.props: a local build
      # stays workable while CI refuses to let a warning through.
      - name: Build
        run: dotnet build --no-restore -c Release -warnaserror

      - name: Test
        run: >-
          dotnet test --no-build -c Release
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./artifacts/test-results

      - name: Upload test results
        # Results are most useful precisely when the step above failed.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./artifacts/test-results
          retention-days: 14

  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify formatting against .editorconfig
        run: dotnet format --verify-no-changes --verbosity diagnostic

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks scans commits, not just the worktree, so it needs history.
          fetch-depth: 0

      # The gitleaks binary (MIT) is used directly rather than
      # gitleaks/gitleaks-action, because that action requires a paid
      # GITLEAKS_LICENSE for repositories owned by an organisation. The binary
      # has no such restriction, and pinning the version keeps a scanner from
      # changing under us silently.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan history for committed credentials
        run: >-
          gitleaks git .
          --config .gitleaks.toml
          --redact
          --verbose
          --report-format sarif
          --report-path ./artifacts/gitleaks.sarif

      - name: Upload scan report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: ./artifacts/gitleaks.sarif
          retention-days: 14

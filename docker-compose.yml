# ============================================================================
# Local development stack.
#
# Phase 0 of ROADMAP.md asks for a Docker Compose definition; this is it.
#
#   docker compose up --build                     # app on http://localhost:5114
#   docker compose --profile postgres up -d db     # PostgreSQL only (see note below)
#   docker compose down -v                         # stop and delete the volumes
#
# NOTE ON THE DATABASE: the application stores its change log, thresholds and
# scan verdicts in SQLite — no server, one file, free. That is what the `app`
# service uses. The `postgres` profile brings up a PostgreSQL instance for the
# hosted-deployment work in ROADMAP.md Phase 27; the application cannot use it
# yet (see the PostgreSQL note in README.md). The credentials below are
# local-only development values and are deliberately not secret.
# ============================================================================

name: msads-auditor

services:
  # Opt-in: `docker compose --profile postgres up db`. Here so that the PostgreSQL work in
  # ROADMAP.md Phase 27 has somewhere to start, not because the application uses it yet.
  db:
    image: postgres:17-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: msads_auditor
      POSTGRES_USER: msads
      POSTGRES_PASSWORD: local-development-only
      # Deterministic collation, so ordering does not vary by host locale.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    ports:
      # Bound to loopback only: nothing on the network can reach the database.
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msads -d msads_auditor"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      target: final
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # Demo mode by default — no credentials, synthetic figures, labelled as
      # demo everywhere. Switch to Live only with real credentials supplied
      # out of band (user secrets or the environment), never in this file.
      Auditor__Mode: Demo
      # SQLite, held on a named volume so the change log survives `docker compose down`.
      # NOT PostgreSQL: the migrations in MsAds.Auditor.Data are generated for SQLite and
      # selecting Postgres throws on startup by design. See the PostgreSQL note in README.md.
      Auditor__Persistence__Provider: Sqlite
      Auditor__Persistence__ConnectionString: Data Source=/data/msads-auditor.db
    volumes:
      - app-data:/data
    ports:
      # 5114 matches the registered OAuth redirect URI.
      - "127.0.0.1:5114:8080"

volumes:
  app-data:
  db-data:
